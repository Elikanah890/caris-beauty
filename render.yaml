services:
  - type: web
    name: caris-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    preDeployCommand: node dist/src/db/migrate.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: "true"
      - key: ACCESS_TOKEN_TTL
        value: 8h
      - key: REFRESH_TOKEN_TTL
        value: 30d
      - key: DATABASE_URL
        fromDatabase:
          name: caris-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: caris-db
    databaseName: caris
    user: caris
